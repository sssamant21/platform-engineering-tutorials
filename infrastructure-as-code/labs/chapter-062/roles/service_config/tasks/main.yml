---
- name: Validate local target and safe role inputs
  ansible.builtin.assert:
    that:
      - inventory_hostname == 'localhost'
      - ansible_connection == 'local'
      - service_port | int >= 1024
      - service_port | int <= 65535
      - service_name | length > 0
- name: Create dedicated sandbox
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../sandbox"
    state: directory
    mode: '0750'
- name: Render service configuration
  ansible.builtin.template:
    src: service.conf.j2
    dest: "{{ playbook_dir }}/../sandbox/service.conf"
    mode: '0640'
  notify: Record role configuration change
- name: Read rendered configuration
  ansible.builtin.slurp:
    src: "{{ playbook_dir }}/../sandbox/service.conf"
  register: rendered_config
  when: not ansible_check_mode
- name: Validate rendered configuration
  ansible.builtin.assert:
    that:
      - "'service_name=' ~ service_name in (rendered_config.content | b64decode)"
      - "'service_port=' ~ (service_port | string) in (rendered_config.content | b64decode)"
  when: not ansible_check_mode
